<style>
  :root {
    --paper: #F6F4EF;
    --card: #FFFFFF;
    --ink: #2B2A27;
    --muted: #6B675F;
    --accent: #4B5D63;
    --accent-soft: #E4E9E9;
    --line: #DAD5C8;
    --serif: "Noto Serif KR", "Batang", "Nanum Myeongjo", serif;
    --sans: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-tap-highlight-color: transparent;
  }

  header {
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
  }

  .eyebrow { font-size: 14px; color: var(--muted); margin-bottom: 6px; }

  h1 {
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 600;
    margin: 0 0 6px;
    line-height: 1.35;
  }

  .subject { font-size: 15px; color: var(--muted); }

  main { padding: 20px; max-width: 640px; margin: 0 auto; }

  .group-title {
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    margin: 28px 0 10px;
  }

  .group-title:first-child { margin-top: 0; }

  ul { list-style: none; margin: 0; padding: 0; }

  li { margin: 0 0 10px; }

  a.order-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 16px 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    text-decoration: none;
    color: inherit;
  }

  a.order-item:active { background: var(--accent-soft); }

  .order-title {
    flex: 1;
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
  }

  .order-arrow { color: var(--muted); font-size: 18px; flex: none; }

  footer { padding: 24px 20px 40px; text-align: center; color: var(--muted); font-size: 13px; }
</style>
