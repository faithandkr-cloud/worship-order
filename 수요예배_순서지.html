<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>예배 순서지</title>
<style>
  :root {
    --paper: #F6F4EF;
    --card: #FFFFFF;
    --ink: #2B2A27;
    --muted: #6B675F;
    --accent: #4B5D63;
    --accent-soft: #E4E9E9;
    --line: #DAD5C8;
    --serif: "Noto Serif KR", "Batang", "Nanum Myeongjo", serif;
    --sans: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", -apple-system, sans-serif;
    --scale: 1;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  body { min-height: 100vh; min-height: 100dvh; }

  /* ── 상단 헤더 / 목록 ──────────────────────── */

  header {
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
    position: sticky;
    top: 0;
    z-index: 5;
  }

  .eyebrow { font-size: 14px; color: var(--muted); margin-bottom: 6px; }

  h1 {
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 600;
    margin: 0 0 4px;
  }

  .subject { font-size: 16px; color: var(--muted); }

  .text-size-control { display: flex; gap: 8px; margin-top: 16px; }

  .text-size-control button {
    flex: 1;
    padding: 10px 0;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 8px;
    font-family: var(--sans);
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
  }

  .text-size-control button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }

  .order-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }

  .order-item {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    text-align: left;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    cursor: pointer;
    font-family: var(--sans);
    color: var(--ink);
  }

  .order-item:active { background: var(--accent-soft); }
  .order-item.sub { margin-left: 28px; border-style: dashed; }

  .order-num {
    flex: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    font-family: var(--serif);
    font-weight: 600;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .order-item.sub .order-num { background: transparent; color: var(--muted); font-size: 12px; }

  .order-body { flex: 1; min-width: 0; }
  .order-title { font-size: 17px; font-weight: 600; }
  .order-desc { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .order-arrow { flex: none; color: var(--muted); font-size: 20px; }

  /* ── 전체화면 상세(페이지 넘김) ───────────────── */

  .detail-overlay {
    position: fixed;
    inset: 0;
    background: var(--paper);
    z-index: 20;
    display: none;
    flex-direction: column;
  }

  .detail-overlay.open { display: flex; }

  .detail-header {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px;
    border-bottom: 1px solid var(--line);
  }

  .detail-close {
    background: var(--card);
    border: 1px solid var(--line);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 20px;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .detail-header-title { font-family: var(--serif); font-size: 17px; font-weight: 600; color: var(--muted); }

  /* 페이지 뷰포트 — 여기 안쪽만 매 페이지 내용으로 교체된다 */
  .pager-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  .pager-viewport {
    position: absolute;
    inset: 0;
    padding: 20px 26px;
    overflow: hidden;
  }

  .pager-viewport-inner {
    max-width: 640px;
    margin: 0 auto;
  }

  /* 좌우 탭 영역(화면 절반씩 눌러도 넘어가게) */
  .tap-zone {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 30%;
    z-index: 2;
  }
  .tap-zone.left { left: 0; }
  .tap-zone.right { right: 0; }

  .detail-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    background: var(--paper);
  }

  .page-nav-btn {
    flex: 1;
    padding: 14px 0;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }

  .page-nav-btn:disabled { visibility: hidden; }

  .page-indicator {
    flex: none;
    min-width: 60px;
    text-align: center;
    font-size: 14px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* ── 내용 블록 스타일 ─────────────────────── */

  .para {
    font-size: calc(19px * var(--scale));
    line-height: 1.9;
    margin: 0 0 20px;
  }

  .detail-title {
    font-family: var(--serif);
    font-size: calc(24px * var(--scale));
    font-weight: 700;
    line-height: 1.4;
    margin: 8px 0 6px;
  }

  .detail-meta { font-size: calc(14px * var(--scale)); color: var(--muted); margin: 0 0 20px; }

  .scripture-block {
    font-family: var(--serif);
    font-size: calc(21px * var(--scale));
    line-height: 2;
    background: var(--card);
    border-left: 4px solid var(--accent);
    padding: 20px 24px;
    border-radius: 4px;
    margin: 0 0 20px;
  }

  .scripture-ref {
    display: block;
    margin-top: 14px;
    font-family: var(--sans);
    font-size: calc(14px * var(--scale));
    color: var(--muted);
    text-align: right;
  }

  .section-label {
    font-size: calc(14px * var(--scale));
    color: var(--accent);
    font-weight: 600;
    margin: 0 0 14px;
  }

  .section-divider { border: none; border-top: 1px solid var(--line); margin: 8px 0 24px; }

  .hymn-number {
    font-family: var(--serif);
    font-size: calc(64px * var(--scale));
    font-weight: 700;
    text-align: center;
    margin: 40px 0 4px;
    color: var(--accent);
  }

  .hymn-caption { text-align: center; font-size: calc(18px * var(--scale)); color: var(--muted); margin: 0 0 24px; }

  .hymn-sheet-placeholder {
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: calc(14px * var(--scale));
    line-height: 1.7;
  }

  .hymn-sheet-image {
    width: 100%;
    border-radius: 8px;
    display: block;
    margin: 0 0 8px;
  }

  /* ── 헤더 상단(제목 + 설정 버튼) ─────────────── */

  .header-top-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .header-btn-group {
    flex: none;
    display: flex;
    gap: 8px;
  }

  .settings-btn {
    flex: none;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--card);
    font-size: 19px;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
  }

  .settings-btn:active { background: var(--accent-soft); }

  /* 대문으로 돌아가는 홈 버튼 — 화면 오른쪽 아래에 떠 있는 동그란 버튼 */

  .home-fab {
    position: fixed;
    right: 18px;
    bottom: 18px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    text-decoration: none;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
    z-index: 10;
  }

  .home-fab:active { background: var(--accent-soft); }

  /* ── 설정 화면 ─────────────────────────────── */

  .settings-overlay {
    position: fixed;
    inset: 0;
    background: var(--paper);
    z-index: 30;
    display: none;
    flex-direction: column;
  }

  .settings-overlay.open { display: flex; }

  .settings-body {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 20px 16px 60px;
  }

  .settings-body-inner { max-width: 640px; margin: 0 auto; }

  .settings-section { margin: 0 0 32px; }

  .settings-section h2 {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 14px;
    color: var(--ink);
  }

  .settings-hint { font-size: 13px; color: var(--muted); margin: -8px 0 16px; }

  .settings-field { margin: 0 0 14px; }

  .settings-field label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 6px;
  }

  .settings-field input[type="text"],
  .settings-field textarea,
  .settings-field select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: var(--sans);
    font-size: 15px;
    background: var(--card);
    color: var(--ink);
    resize: vertical;
  }

  .settings-field textarea { min-height: 90px; line-height: 1.6; }

  /* 순서 목록 — 네이버 블로그 카테고리 관리처럼, 평소엔 한 줄로만 보이고
     눌러야 그 항목의 편집 칸이 펼쳐진다(한 번에 하나씩 작업). */

  .item-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    margin: 0 0 8px;
    background: var(--card);
    cursor: pointer;
  }

  .item-row.expanded { border-radius: 10px 10px 0 0; border-color: var(--accent); border-bottom: none; margin-bottom: 0; }

  .item-row-main { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }

  .item-row-num {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .item-row-title {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .item-row-badge {
    flex: none;
    font-size: 11px;
    color: var(--muted);
    background: var(--accent-soft);
    padding: 3px 9px;
    border-radius: 20px;
  }

  .item-row-actions { flex: none; display: flex; gap: 4px; }

  .item-row-actions button {
    border: 1px solid var(--line);
    background: var(--paper);
    border-radius: 6px;
    padding: 6px 9px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }

  .item-row-actions button.danger { color: #B24B4B; border-color: #E3B9B9; }

  .item-row.hidden-row { opacity: 0.5; }

  .item-row-hide-toggle {
    flex: none;
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    padding: 0 2px;
  }

  .preset-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 16px;
  }

  .preset-btn {
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--accent);
    font-family: var(--sans);
    font-size: 13px;
    cursor: pointer;
  }

  .preset-btn:active { background: var(--accent-soft); }

  .settings-field input[type="file"] {
    width: 100%;
    padding: 10px 0;
    border: none;
    background: transparent;
    font-size: 13px;
    color: var(--muted);
  }

  .hymn-image-preview {
    width: 100%;
    max-width: 260px;
    border-radius: 8px;
    display: block;
    margin: 8px 0 0;
    border: 1px solid var(--line);
  }

  .item-detail {
    border: 1px solid var(--accent);
    border-top: 1px dashed var(--line);
    border-radius: 0 0 10px 10px;
    padding: 16px;
    margin: 0 0 10px;
    background: var(--card);
  }

  .item-detail-hint { font-size: 12px; color: var(--muted); margin: 0 0 14px; }

  .field-group {
    border-top: 1px dashed var(--line);
    margin: 14px 0 0;
    padding: 14px 0 0;
  }

  .field-group.hidden { display: none; }

  .field-group-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    margin: 0 0 10px;
  }

  .checkbox-field {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
    margin: 10px 0 0;
  }

  .add-item-btn, .settings-save-btn, .settings-reset-btn {
    width: 100%;
    padding: 14px 0;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--accent);
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  .settings-save-btn { background: var(--accent); color: #fff; border-color: var(--accent); }

  .settings-reset-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    font-weight: 400;
    font-size: 13px;
    text-decoration: underline;
    padding: 10px 0 0;
  }
</style>
</head>
<body>

<a class="home-fab" href="대문.html" aria-label="대문으로">🏠</a>

<header>
  <div class="header-top-row">
    <div>
      <div class="eyebrow">예배 순서지</div>
      <h1 id="serviceTitleDisplay">故 송철헌 집사님 추도예배</h1>
    </div>
    <div class="header-btn-group">
      <button class="settings-btn" id="settingsOpenBtn" aria-label="설정">⚙</button>
    </div>
  </div>
  <div class="subject">항목을 누르면 내용이 크게 표시됩니다</div>
  <div class="text-size-control">
    <button data-scale="0.85">글자 작게</button>
    <button data-scale="1" class="active">보통</button>
    <button data-scale="1.3">글자 크게</button>
  </div>
</header>

<main>
  <ul class="order-list" id="orderList"></ul>
</main>

<div class="detail-overlay" id="detailOverlay">
  <div class="detail-header">
    <div class="detail-header-title" id="detailHeaderTitle"></div>
    <button class="detail-close" id="detailClose" aria-label="닫기">✕</button>
  </div>

  <div class="pager-wrap">
    <div class="pager-viewport" id="pagerViewport">
      <div class="pager-viewport-inner" id="pagerInner"></div>
    </div>
    <div class="tap-zone left" id="tapLeft"></div>
    <div class="tap-zone right" id="tapRight"></div>
  </div>

  <div class="detail-footer">
    <button class="page-nav-btn" id="prevBtn">‹ 이전</button>
    <div class="page-indicator" id="pageIndicator"></div>
    <button class="page-nav-btn" id="nextBtn">다음 ›</button>
  </div>
</div>

<div class="settings-overlay" id="settingsOverlay">
  <div class="detail-header">
    <div class="detail-header-title">설정</div>
    <button class="detail-close" id="settingsCloseBtn" aria-label="닫기">✕</button>
  </div>

  <div class="settings-body">
    <div class="settings-body-inner">

      <div class="settings-section">
        <h2>예배 정보</h2>
        <div class="settings-field">
          <label for="serviceTitleInput">예배 이름</label>
          <input type="text" id="serviceTitleInput" placeholder="예: 주일오전예배, 청년예배, 故 OOO 집사님 추도예배 등">
        </div>
      </div>

      <div class="settings-section">
        <h2>예배 순서 배정</h2>
        <div class="settings-hint">항목을 누르면 그 항목의 편집 칸만 펼쳐집니다. 한 번에 하나씩 작업하세요.</div>
        <div id="itemsEditor"></div>

        <div class="settings-hint" style="margin-top:0;">자주 쓰는 순서를 눌러 바로 추가하세요.</div>
        <div class="preset-buttons" id="presetButtons"></div>

        <button class="add-item-btn" id="addItemBtn">+ 새 순서 추가</button>
      </div>

    </div>
  </div>

  <div class="detail-footer" style="display:block;">
    <button class="add-item-btn" id="settingsExportBtn">저장하기 (파일로 저장)</button>
    <div class="settings-hint" style="margin:10px 0 0;">저장 위치를 물어보는 창이 뜨면, 이 파일이 있던 원래 폴더로 가서 같은 파일 이름으로 저장하면 바로 덮어쓰기 됩니다.</div>
    <button class="settings-reset-btn" id="settingsResetBtn">기본 예배 순서로 되돌리기</button>
  </div>
</div>

<script id="embeddedData" type="application/json">{}</script>

<script>
  // ══════════════════════════════════════════════
  // 예배 데이터 모델
  //
  // 순서 항목(item)은 아래 필드를 가진다.
  //   num, sub        : 목록 번호 / 하위 항목 여부
  //   title, desc     : 목록에 표시되는 제목·설명
  //   type            : "일반" | "성경말씀" | "성경본문" | "찬송" | "설교"
  //   content         : 본문 내용(빈 줄로 문단 구분) — 일반/성경말씀/설교에서 사용
  //   scriptureRef/Text/First : 성경 관련 데이터 — 성경말씀/성경본문/설교에서 사용
  //     (scriptureFirst는 성경말씀에서만 의미가 있음: 성경본문은 항상 성경만,
  //      설교는 항상 성경이 내용보다 앞에 고정)
  //   hymnNum/hymnCaption/hymnImage : 찬송 관련 데이터
  //
  //   유형이 "설교"이거나 "성경본문"인 항목은 유형이 고정되어 있어 설정 화면에
  //   "유형" 선택칸이 나타나지 않는다(자주 쓰는 순서 버튼으로만 만들어진다).
  // ══════════════════════════════════════════════

  // 로컬 저장 키에 이 파일의 경로(location.pathname)를 포함시킨다.
  // (예전에는 모든 예배순서지 파일이 이 값을 똑같이 썼는데, 같은 도메인
  // 에서 열면 localStorage가 도메인 단위로 공유되기 때문에 한 파일에서
  // "저장하기"를 누르면 다른 예배순서지까지 그 내용으로 덮어
  // 써지는 문제가 있었다. 파일마다 다른 키를 쓰도록 고쳐서 서로 완전히
  // 분리되게 했다.)
  const STORAGE_KEY = "cdyb_order_service_data_v1:" + (location.pathname || "unknown");

  const defaultServiceTitle = "수요예배";

  // 문단마다 별도 블록으로 나눠야 페이지 계산이 정확해진다 — 빈 줄 기준으로 분리.
  function paragraphs(text) {

    }

    // 일반
    return [`<div class="section-label">${label}</div>`, ...contentBlocks].filter(Boolean);
  }

  // ── 목록 렌더링 ─────────────────────────────

  const serviceTitleDisplay = document.getElementById("serviceTitleDisplay");
  const listEl = document.getElementById("orderList");

  function renderList() {
    serviceTitleDisplay.textContent = serviceTitle;
    document.title = serviceTitle + " — 예배 순서지";

    listEl.innerHTML = "";
    items.filter(item => !item.hidden).forEach(item => {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.className = "order-item" + (item.sub ? " sub" : "");
      btn.innerHTML = `
        <div class="order-num">${item.sub ? "•" : (item.num || "")}</div>
        <div class="order-body">
          <div class="order-title">${item.title || ""}</div>
          <div class="order-desc">${item.desc || ""}</div>
        </div>
        <div class="order-arrow">›</div>
      `;
      btn.addEventListener("click", () => openDetail(item));
      li.appendChild(btn);
      listEl.appendChild(li);
    });
  }

  renderList();

  // ── 페이지 넘김 엔진 ─────────────────────────
  //
  // 각 항목의 블록(문단/성경구절 등 HTML 조각)을, 실제 화면 높이에 맞춰
  // "한 화면에 들어가는 만큼씩" 그리디하게 묶어 페이지로 나눈다.
  // 글자 크기를 바꾸거나 화면 방향이 바뀌면 다시 계산한다.

  const overlay = document.getElementById("detailOverlay");
  const detailHeaderTitle = document.getElementById("detailHeaderTitle");
  const pagerViewport = document.getElementById("pagerViewport");
  const pagerInner = document.getElementById("pagerInner");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const pageIndicator = document.getElementById("pageIndicator");
  const tapLeft = document.getElementById("tapLeft");
  const tapRight = document.getElementById("tapRight");

  let currentItem = null;
  let currentPages = [[]];
  let currentPageIndex = 0;

  function paginateBlocks(blockHtmls) {
    const measurer = document.createElement("div");
    measurer.className = "pager-viewport-inner";
    measurer.style.position = "absolute";
    measurer.style.visibility = "hidden";
    measurer.style.pointerEvents = "none";
    measurer.style.width = pagerInner.clientWidth + "px";
    document.body.appendChild(measurer);

    const maxHeight = pagerViewport.clientHeight - 40; // 상하 padding 20px씩
    const pages = [];
    let current = [];

    for (const html of blockHtmls) {
      const test = current.concat([html]);
      measurer.innerHTML = test.join("");
      if (measurer.scrollHeight > maxHeight && current.length > 0) {
        pages.push(current);
        current = [html];
      } else {
        current = test;
      }
    }
    if (current.length) pages.push(current);
    if (pages.length === 0) pages.push([]);

    document.body.removeChild(measurer);
    return pages;
  }

  function openDetail(item) {
    currentItem = item;
    detailHeaderTitle.textContent = item.title;
    overlay.classList.add("open");
    // overlay가 display:flex로 바뀐 다음 프레임에 실제 크기를 재야 정확하다.
    requestAnimationFrame(recomputePages);
  }

  function recomputePages() {
    if (!currentItem) return;
    currentPages = paginateBlocks(buildBlocks(currentItem));
    currentPageIndex = 0;
    renderPage();
  }

  function renderPage() {
    pagerInner.innerHTML = currentPages[currentPageIndex]?.join("") ?? "";
    const total = currentPages.length;
    pageIndicator.textContent = total > 1 ? `${currentPageIndex + 1} / ${total}` : "";
    prevBtn.disabled = currentPageIndex === 0;
    nextBtn.disabled = currentPageIndex === total - 1;
  }

  function goNext() {
    if (currentPageIndex < currentPages.length - 1) {
      currentPageIndex++;
      renderPage();
    }
  }

  function goPrev() {
    if (currentPageIndex > 0) {
      currentPageIndex--;
      renderPage();
    }
  }

  prevBtn.addEventListener("click", goPrev);
  nextBtn.addEventListener("click", goNext);
  tapLeft.addEventListener("click", goPrev);
  tapRight.addEventListener("click", goNext);

  document.getElementById("detailClose").addEventListener("click", () => {
    overlay.classList.remove("open");
    currentItem = null;
  });

  // 스와이프(좌우로 손가락 밀기)
  let touchStartX = null, touchStartY = null;
  pagerViewport.addEventListener("touchstart", e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  pagerViewport.addEventListener("touchend", e => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) goNext(); else goPrev();
    }
    touchStartX = null; touchStartY = null;
  }, { passive: true });

  // 키보드(화살표)도 지원 — 데스크탑에서 미리보기/연습할 때 편하게
  document.addEventListener("keydown", e => {
    if (!overlay.classList.contains("open")) return;
    if (e.key === "ArrowRight") goNext();
    if (e.key === "ArrowLeft") goPrev();
    if (e.key === "Escape") { overlay.classList.remove("open"); currentItem = null; }
  });

  // 글자 크기 변경 — 열려 있는 항목이 있으면 페이지를 다시 계산한다
  // (페이지당 들어가는 분량이 바뀌므로 1페이지로 리셋).
  document.querySelectorAll(".text-size-control button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".text-size-control button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      document.documentElement.style.setProperty("--scale", btn.dataset.scale);
      if (overlay.classList.contains("open")) requestAnimationFrame(recomputePages);
    });
  });

  // 화면 방향 전환 등 — 열려 있을 때만, 살짝 지연 후 재계산
  let resizeTimer = null;
  window.addEventListener("resize", () => {
    if (!overlay.classList.contains("open")) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(recomputePages, 200);
  });

  // ══════════════════════════════════════════════
  // 설정 화면 — 예배 이름 · 순서 배정 · 내용/데이터 입력
  // ══════════════════════════════════════════════

  const settingsOverlay = document.getElementById("settingsOverlay");
  const settingsOpenBtn = document.getElementById("settingsOpenBtn");
  const settingsCloseBtn = document.getElementById("settingsCloseBtn");
  const serviceTitleInput = document.getElementById("serviceTitleInput");
  const itemsEditor = document.getElementById("itemsEditor");
  const addItemBtn = document.getElementById("addItemBtn");
  const presetButtons = document.getElementById("presetButtons");
  const settingsResetBtn = document.getElementById("settingsResetBtn");
  const settingsExportBtn = document.getElementById("settingsExportBtn");

  // 자주 쓰는 순서 — 눌러서 예배순서 배정에 바로 추가한다.
  // 더 필요한 순서는 "+ 새 순서 추가"로 직접 만들면 된다.
  const PRESET_ITEMS = [
    { label: "경배와찬양", type: "일반", desc: "다같이" },
    { label: "묵도", type: "성경말씀", desc: "다 함께", scriptureFirst: true },
    { label: "찬송", type: "찬송", desc: "다같이" },
    { label: "대표기도", type: "일반", desc: "" },
    { label: "통성기도", type: "일반", desc: "다같이" },
    { label: "성경봉독", type: "성경본문", desc: "" },
    { label: "설교", type: "설교", desc: "" },
    { label: "특송", type: "일반", desc: "" },
    { label: "헌금", type: "일반", desc: "" },
    { label: "헌금송", type: "찬송", desc: "" },
    { label: "광고", type: "일반", desc: "" },
    { label: "주기도문", type: "성경말씀", desc: "예배를 마치며", scriptureText: lordsPrayerRaw, scriptureFirst: false },
    { label: "폐회송", type: "찬송", desc: "" },
    { label: "축도", type: "일반", desc: "" },
  ];

  // 편집 중에는 items를 직접 건드리지 않고 별도의 작업본(draft)에서 수정한 뒤
  // "저장" 버튼을 눌러야만 실제 목록에 반영한다.
  let draftItems = [];

  // 지금 펼쳐져 있는 항목의 id — 한 번에 하나만 펼쳐진다(네이버 블로그
  // 카테고리 관리처럼, 목록은 항상 한 줄씩만 보이고 누른 것만 펼쳐서 작업).
  let expandedItemId = null;

  function cloneItems(src) { return src.map(it => Object.assign({}, it)); }

  function openSettings() {
    draftItems = cloneItems(items);
    expandedItemId = null;
    serviceTitleInput.value = serviceTitle;
    renderItemsEditor();
    settingsOverlay.classList.add("open");
  }

  function closeSettings() {
    settingsOverlay.classList.remove("open");
  }

  settingsOpenBtn.addEventListener("click", openSettings);
  settingsCloseBtn.addEventListener("click", closeSettings);

  function addPresetItem(preset) {
    const item = {
      id: newId(),
      num: String(draftItems.filter(it => !it.sub).length + 1),
      sub: false,
      hidden: false,
      title: preset.label,
      desc: preset.desc || "",
      type: preset.type,
      content: preset.content || "",
    };
    if (preset.type === "성경말씀" || preset.type === "설교" || preset.type === "성경본문") {
      item.scriptureRef = preset.scriptureRef || "";
      item.scriptureText = preset.scriptureText || "";
    }
    if (preset.type === "성경말씀") {
      item.scriptureFirst = preset.scriptureFirst !== undefined ? preset.scriptureFirst : true;
    }
    if (preset.type === "찬송") {
      item.hymnNum = preset.hymnNum || "";
      item.hymnCaption = preset.hymnCaption || "";
    }
    draftItems.push(item);
    expandedItemId = item.id;
    renderItemsEditor();
    itemsEditor.querySelector(".item-row.expanded")?.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function renderPresetButtons() {
    presetButtons.innerHTML = "";
    PRESET_ITEMS.forEach(preset => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "preset-btn";
      btn.textContent = preset.label;
      btn.addEventListener("click", () => addPresetItem(preset));
      presetButtons.appendChild(btn);
    });
  }

  renderPresetButtons();

  function fieldGroupsForType(type) {
    // 각 유형에서 어떤 field-group을 보여줄지
    return {
      content: type === "일반" || type === "성경말씀" || type === "설교",
      scripture: type === "성경말씀" || type === "설교" || type === "성경본문",
      hymn: type === "찬송",
      showTypeSelect: type !== "설교" && type !== "성경본문",
      showScriptureFirstToggle: type === "성경말씀",
    };
  }

  function renderItemsEditor() {
    itemsEditor.innerHTML = "";
    draftItems.forEach((item, idx) => {
      itemsEditor.appendChild(buildItemRowGroup(item, idx));
    });
  }

  // 한 항목 = [한 줄 요약 행] + (펼쳐진 경우에만) [편집 칸]
  function buildItemRowGroup(item, idx) {
    const wrap = document.createElement("div");
    const isExpanded = expandedItemId === item.id;

    const row = document.createElement("div");
    row.className = "item-row" + (isExpanded ? " expanded" : "") + (item.hidden ? " hidden-row" : "");
    row.innerHTML = `
      <div class="item-row-main">
        <span class="item-row-num">${item.sub ? "•" : (item.num || "-")}</span>
        <span class="item-row-title">${escapeText(item.title) || "(제목 없음)"}</span>
        <span class="item-row-badge">${item.type}</span>
      </div>
      <div class="item-row-actions">
        <label class="item-row-hide-toggle" title="체크하면 예배 순서 목록에서 숨겨집니다">
          <input type="checkbox" class="hide-checkbox" ${item.hidden ? "checked" : ""}>
          숨김
        </label>
        <button type="button" class="item-row-up" title="위로">▲</button>
        <button type="button" class="item-row-down" title="아래로">▼</button>
        <button type="button" class="item-row-delete danger" title="삭제">삭제</button>
      </div>
    `;

    row.querySelector(".item-row-main").addEventListener("click", () => {
      expandedItemId = isExpanded ? null : item.id;
      renderItemsEditor();
    });

    row.querySelector(".hide-checkbox").addEventListener("click", e => e.stopPropagation());
    row.querySelector(".hide-checkbox").addEventListener("change", e => {
      draftItems[idx].hidden = e.target.checked;
      row.classList.toggle("hidden-row", e.target.checked);
    });

    row.querySelector(".item-row-up").addEventListener("click", e => {
      e.stopPropagation();
      if (idx === 0) return;
      [draftItems[idx - 1], draftItems[idx]] = [draftItems[idx], draftItems[idx - 1]];
      renderItemsEditor();
    });

    row.querySelector(".item-row-down").addEventListener("click", e => {
      e.stopPropagation();
      if (idx === draftItems.length - 1) return;
      [draftItems[idx + 1], draftItems[idx]] = [draftItems[idx], draftItems[idx + 1]];
      renderItemsEditor();
    });

    row.querySelector(".item-row-delete").addEventListener("click", e => {
      e.stopPropagation();
      if (!confirm(`"${draftItems[idx].title || "이 순서"}" 항목을 삭제할까요?`)) return;
      if (expandedItemId === draftItems[idx].id) expandedItemId = null;
      draftItems.splice(idx, 1);
      renderItemsEditor();
    });

    wrap.appendChild(row);
    if (isExpanded) {
      wrap.appendChild(buildItemDetailPanel(item, idx, row));
    }
    return wrap;
  }

  // 펼쳐진 항목의 실제 편집 칸 — 번호/제목/설명/유형 + 내용/데이터 입력
  function buildItemDetailPanel(item, idx, rowEl) {
    const panel = document.createElement("div");
    panel.className = "item-detail";

    const groups = fieldGroupsForType(item.type);

    panel.innerHTML = `
      <div class="item-detail-hint">이 항목만 수정합니다. 다 끝나면 목록으로 접어두고 다음 항목을 눌러 이어서 편집하세요.</div>

      <div class="settings-field">
        <label>번호</label>
        <input type="text" class="num-input" value="${escapeAttr(item.num)}" placeholder="번호" ${item.sub ? "disabled" : ""}>
      </div>
      <label class="checkbox-field" style="margin:0 0 14px;">
        <input type="checkbox" class="sub-checkbox" ${item.sub ? "checked" : ""}>
        하위 항목(번호 없이 · 표시)
      </label>

      <div class="settings-field">
        <label>제목 (목록에 표시)</label>
        <input type="text" class="title-input" value="${escapeAttr(item.title)}">
      </div>

      <div class="settings-field">
        <label>설명 (목록에 표시되는 한 줄 요약)</label>
        <input type="text" class="desc-input" value="${escapeAttr(item.desc)}">
      </div>

      ${groups.showTypeSelect ? `
      <div class="settings-field">
        <label>유형</label>
        <select class="type-select">
          <option value="일반">일반 (본문 텍스트만)</option>
          <option value="성경말씀">성경말씀 (성경구절 포함)</option>
          <option value="찬송">찬송 (찬송가 장 번호)</option>
        </select>
      </div>
      ` : ""}

      <div class="field-group content-field ${groups.content ? "" : "hidden"}">
        <div class="field-group-title">${item.type === "설교" ? "설교 내용" : "내용 입력"}</div>
        <div class="settings-field">
          <label>${item.type === "설교" ? "설교 내용 (빈 줄로 문단 구분)" : "본문 내용 (빈 줄로 문단 구분)"}</label>
          <textarea class="content-input">${escapeText(item.content)}</textarea>
        </div>
      </div>

      <div class="field-group scripture-field ${groups.scripture ? "" : "hidden"}">
        <div class="field-group-title">${item.type === "성경본문" ? "성경본문" : "성경 관련 데이터"}</div>
        <div class="settings-field">
          <label>성경 출처</label>
          <input type="text" class="scripture-ref-input" value="${escapeAttr(item.scriptureRef)}" placeholder="예: 디모데후서 4:7~8">
        </div>
        <div class="settings-field">
          <label>성경 본문</label>
          <textarea class="scripture-text-input">${escapeText(item.scriptureText)}</textarea>
        </div>
        ${groups.showScriptureFirstToggle ? `
        <label class="checkbox-field">
          <input type="checkbox" class="scripture-first-checkbox" ${item.scriptureFirst ? "checked" : ""}>
          성경구절을 본문 내용보다 앞에 표시
        </label>
        ` : ""}
      </div>

      <div class="field-group hymn-field ${groups.hymn ? "" : "hidden"}">
        <div class="field-group-title">찬송 관련 데이터</div>
        <div class="settings-field">
          <label>찬송가 장 번호</label>
          <input type="text" class="hymn-num-input" value="${escapeAttr(item.hymnNum)}" placeholder="예: 488">
        </div>
        <div class="settings-field">
          <label>안내 문구</label>
          <input type="text" class="hymn-caption-input" value="${escapeAttr(item.hymnCaption)}" placeholder="예: 다 함께 찬송가 488장을 부르겠습니다">
        </div>
        <div class="settings-field">
          <label>찬송가 악보 사진</label>
          <input type="file" accept="image/*" class="hymn-image-input">
          ${item.hymnImage ? `<img class="hymn-image-preview" src="${item.hymnImage}" alt="악보 미리보기">` : ""}
          ${item.hymnImage ? `<button type="button" class="hymn-image-remove-btn settings-reset-btn" style="padding:8px 0;">사진 삭제</button>` : ""}
        </div>
      </div>
    `;

    const typeSelect = panel.querySelector(".type-select"); // 설교·성경본문 유형에는 없음(null일 수 있음)
    if (typeSelect) typeSelect.value = item.type;

    const rowTitleEl = rowEl.querySelector(".item-row-title");
    const rowNumEl = rowEl.querySelector(".item-row-num");
    const rowBadgeEl = rowEl.querySelector(".item-row-badge");

    // ── 이벤트 바인딩 (draftItems를 직접 갱신, 목록 전체를 다시 그리지
    //    않아 입력 중 포커스가 끊기지 않는다) ──

    panel.querySelector(".num-input").addEventListener("input", e => {
      draftItems[idx].num = e.target.value;
      rowNumEl.textContent = draftItems[idx].sub ? "•" : (e.target.value || "-");
    });

    panel.querySelector(".sub-checkbox").addEventListener("change", e => {
      draftItems[idx].sub = e.target.checked;
      panel.querySelector(".num-input").disabled = e.target.checked;
      rowNumEl.textContent = e.target.checked ? "•" : (draftItems[idx].num || "-");
    });

    panel.querySelector(".title-input").addEventListener("input", e => {
      draftItems[idx].title = e.target.value;
      rowTitleEl.textContent = e.target.value || "(제목 없음)";
    });

    panel.querySelector(".desc-input").addEventListener("input", e => {
      draftItems[idx].desc = e.target.value;
    });

    if (typeSelect) {
      typeSelect.addEventListener("change", e => {
        draftItems[idx].type = e.target.value;
        rowBadgeEl.textContent = e.target.value;
        const g = fieldGroupsForType(e.target.value);
        panel.querySelector(".content-field").classList.toggle("hidden", !g.content);
        panel.querySelector(".scripture-field").classList.toggle("hidden", !g.scripture);
        panel.querySelector(".hymn-field").classList.toggle("hidden", !g.hymn);
        panel.querySelector(".content-field label").textContent = "본문 내용 (빈 줄로 문단 구분)";
      });
    }

    panel.querySelector(".content-input").addEventListener("input", e => {
      draftItems[idx].content = e.target.value;
    });

    panel.querySelector(".scripture-ref-input").addEventListener("input", e => {
      draftItems[idx].scriptureRef = e.target.value;
    });

    panel.querySelector(".scripture-text-input").addEventListener("input", e => {
      draftItems[idx].scriptureText = e.target.value;
    });

    panel.querySelector(".scripture-first-checkbox")?.addEventListener("change", e => {
      draftItems[idx].scriptureFirst = e.target.checked;
    });

    panel.querySelector(".hymn-num-input").addEventListener("input", e => {
      draftItems[idx].hymnNum = e.target.value;
    });

    panel.querySelector(".hymn-caption-input").addEventListener("input", e => {
      draftItems[idx].hymnCaption = e.target.value;
    });

    panel.querySelector(".hymn-image-input").addEventListener("change", e => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        draftItems[idx].hymnImage = reader.result;
        renderItemsEditor(); // 미리보기를 보여주기 위해 다시 그린다
      };
      reader.readAsDataURL(file);
    });

    const hymnImageRemoveBtn = panel.querySelector(".hymn-image-remove-btn");
    if (hymnImageRemoveBtn) {
      hymnImageRemoveBtn.addEventListener("click", () => {
        draftItems[idx].hymnImage = null;
        renderItemsEditor();
      });
    }

    return panel;
  }

  function escapeAttr(v) {
    return (v || "").toString().replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  }

  function escapeText(v) {
    return (v || "").toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  addItemBtn.addEventListener("click", () => {
    const item = {
      id: newId(),
      num: String(draftItems.filter(it => !it.sub).length + 1),
      sub: false,
      title: "새 순서",
      desc: "",
      type: "일반",
      content: ""
    };
    draftItems.push(item);
    expandedItemId = item.id; // 새로 추가한 항목을 바로 펼쳐서 이어서 입력하게 한다
    renderItemsEditor();
    itemsEditor.querySelector(".item-row.expanded")?.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  function sanitizeFilename(name) {
    return (name || "예배순서지").replace(/[\\/:*?"<>|]/g, "").trim() || "예배순서지";
  }

  // 지금 화면에 있는 데이터를 새 HTML 파일 하나로 그대로 담아 다운로드한다.
  // 이 파일은 로컬 저장(localStorage)과 무관하게 그 안에 데이터를 가지고
  // 있으므로, 다른 컴퓨터로 옮겨서 열어도 내용이 그대로 보인다.
  function downloadExportedHtml() {
    const docClone = document.documentElement.cloneNode(true);
    docClone.querySelectorAll(".detail-overlay, .settings-overlay").forEach(el => el.classList.remove("open"));
    const dataScript = docClone.querySelector("#embeddedData");
    if (dataScript) dataScript.textContent = JSON.stringify({ serviceTitle, items });

    const html = "<!DOCTYPE html>\n" + docClone.outerHTML;
    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = sanitizeFilename(serviceTitle) + "_순서지.html";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  settingsExportBtn.addEventListener("click", () => {
    serviceTitle = serviceTitleInput.value.trim() || defaultServiceTitle;
    items = cloneItems(draftItems);
    saveState();
    renderList();
    downloadExportedHtml();
    closeSettings();
  });

  settingsResetBtn.addEventListener("click", () => {
    if (!confirm("모든 항목을 기본 예배 순서로 되돌릴까요? 지금까지 편집한 내용은 사라집니다.")) return;
    draftItems = defaultItems();
    expandedItemId = null;
    serviceTitleInput.value = defaultServiceTitle;
    renderItemsEditor();
  });
</script>

</body>
</html>
